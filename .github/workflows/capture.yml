name: capture

on:
  schedule:
    # 1日4回。public リポジトリなので Actions 分数の制限は無い。
    #
    # 並列化ではなく回数を増やしている。撮影済みの索引は R2 上の1ファイルを
    # read-modify-write するので、同時に走らせると上書きし合って壊れる
    # （下の concurrency がそれを防いでいる）。回数を増やす形なら
    # concurrency が自動で直列化するため索引は安全。
    #
    # DMM への瞬間的な負荷も変わらない（どの時点でも撮影は1件ずつ）。
    # 過去に4並列でAPIキーをブロックされた前例があるので、同時接続は増やさない。
    #
    # 1回400件＝約4.8時間。6時間ずつ空けてあるので重ならない。
    - cron: '0 19 * * *'   # JST 04:00
    - cron: '0  1 * * *'   # JST 10:00
    - cron: '0  7 * * *'   # JST 16:00
    - cron: '0 13 * * *'   # JST 22:00
  workflow_dispatch:
    inputs:
      max_works:
        description: "1回の撮影上限"
        required: false
        default: "400"
        type: string
      pages:
        description: "APIを何ページ見るか(1ページ100件)"
        required: false
        default: "5"
        type: string
      dry_run:
        description: "撮影せず対象だけ数える"
        required: false
        default: false
        type: boolean

# 同時に走らせない。index を上書きし合って壊れる。
concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    # 撮影は1件約43秒。400件で約4.8時間。6時間上限の手前で切る。
    # 索引は20件ごとに保存するので、時間切れで落ちてもそこまでの成果は残る。
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r capture/requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Capture
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          # public リポジトリでは Variables の値が誰でも見える。
          # バケット名も対象フロアも「どのサイト向けか」の手がかりになるので Secrets に置く。
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TARGETS: ${{ secrets.TARGETS }}
          KEY_PREFIX: ${{ secrets.KEY_PREFIX }}
          INDEX_KEY: ${{ secrets.INDEX_KEY }}
        run: |
          MAX="${{ inputs.max_works }}"; [ -z "$MAX" ] && MAX=400
          PG="${{ inputs.pages }}"; [ -z "$PG" ] && PG=5
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          python capture/capture.py --max "$MAX" --pages "$PG" $DRY
